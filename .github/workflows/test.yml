name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PoB toolchain
        uses: actions/cache@v4
        with:
          path: engine/vendor
          key: vendor-${{ hashFiles('engine/setup.sh') }}
      - name: Build PoB toolchain
        run: engine/setup.sh
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
